<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Skill Library Reference Architecture social preview</title>
  <desc id="desc">A public alpha reference architecture for scalable AI skill libraries, showing flat skills progressing to routing, retrieval, and governance.</desc>
  <rect width="1280" height="640" fill="#FFFFFF"/>
  <rect x="44" y="44" width="1192" height="552" rx="28" fill="#F7FAFB" stroke="#CBD5DA" stroke-width="2"/>

  <text x="92" y="132" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="700" fill="#13343B">Skill Library Reference Architecture</text>
  <text x="94" y="178" font-family="Inter, Arial, sans-serif" font-size="25" fill="#546E7A">Scale AI skills with progressive disclosure, policy gates, retrieval, telemetry, and evaluation.</text>

  <rect x="1034" y="88" width="154" height="44" rx="22" fill="#FFF3E0" stroke="#C47530" stroke-width="2"/>
  <text x="1111" y="116" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#13343B">PUBLIC ALPHA</text>

  <g transform="translate(92 258)">
    <rect x="0" y="0" width="222" height="152" rx="18" fill="#20808D" stroke="#187078" stroke-width="3"/>
    <text x="28" y="48" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">Level 0</text>
    <text x="28" y="86" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">Flat</text>
    <text x="28" y="122" font-family="Inter, Arial, sans-serif" font-size="20" fill="#E8F4F6">small libraries</text>

    <rect x="282" y="0" width="222" height="152" rx="18" fill="#20808D" stroke="#187078" stroke-width="3"/>
    <text x="310" y="48" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">Level 1</text>
    <text x="310" y="86" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">Route</text>
    <text x="310" y="122" font-family="Inter, Arial, sans-serif" font-size="20" fill="#E8F4F6">static compiler</text>

    <rect x="564" y="0" width="222" height="152" rx="18" fill="#20808D" stroke="#187078" stroke-width="3"/>
    <text x="592" y="48" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">Level 2</text>
    <text x="592" y="86" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">Retrieve</text>
    <text x="592" y="122" font-family="Inter, Arial, sans-serif" font-size="20" fill="#E8F4F6">filtered catalog</text>

    <rect x="846" y="0" width="222" height="152" rx="18" fill="#13343B" stroke="#607D8B" stroke-width="3"/>
    <text x="874" y="48" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">Level 3</text>
    <text x="874" y="86" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">Govern</text>
    <text x="874" y="122" font-family="Inter, Arial, sans-serif" font-size="20" fill="#E8F4F6">policy and evals</text>

    <path d="M234 76 H270" stroke="#E08A3C" stroke-width="8" stroke-linecap="round"/>
    <path d="M270 76 L254 64 M270 76 L254 88" stroke="#E08A3C" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M516 76 H552" stroke="#E08A3C" stroke-width="8" stroke-linecap="round"/>
    <path d="M552 76 L536 64 M552 76 L536 88" stroke="#E08A3C" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M798 76 H834" stroke="#E08A3C" stroke-width="8" stroke-linecap="round"/>
    <path d="M834 76 L818 64 M834 76 L818 88" stroke="#E08A3C" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(92 482)">
    <rect x="0" y="0" width="1096" height="62" rx="16" fill="#FFF3E0" stroke="#C47530" stroke-width="2"/>
    <text x="28" y="40" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#13343B">Evidence-led thresholds:</text>
    <text x="324" y="40" font-family="Inter, Arial, sans-serif" font-size="22" fill="#13343B">outcomes, routing quality, context share, drift, privacy, latency, cost, rollback</text>
  </g>
</svg>
