$schema: urn:skillref:schema:profile:0.1
schemaVersion: "0.1"
id: read-only
version: 1.0.0
defaultDecision: deny
resolution:
  denialsOverrideGrants: true
  unknownValues: deny
grants:
  - id: allow-static-review-leaves
    selector:
      skillIds:
        - table-analysis
        - code-review
    permissions:
      capabilities:
        - content:read
        - table:analyze
        - code:review
      resourceScopes:
        - task:provided-content
      resourceRoles:
        - instructions
        - reference
      exposureModes:
        - router-retrievable
    reason: This profile allows analysis and review but no mutation.
denials:
  - id: deny-side-effecting-skills
    selector:
      riskLevels:
        - high
        - critical
    reason: Side-effecting skills are outside this read-only example.
