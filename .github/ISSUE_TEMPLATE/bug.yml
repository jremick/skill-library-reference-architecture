name: Bug report
description: Report reproducible behavior in the schemas, validator, compiler, examples, or evaluations.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include secrets, private prompts, machine paths, or proprietary skill inventories.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Synthetic reproduction
      description: Provide the smallest public-safe fixture or command that reproduces the issue.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0a1 or commit SHA
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation output
      description: Summarize the failing check without pasting secrets or private data.
    validations:
      required: true
