name: Validate

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          python-version: ${{ matrix.python-version }}

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Lint and check formatting
        if: matrix.python-version == '3.12'
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Validate architecture artifacts
        run: uv run skillref validate .

      - name: Run tests
        run: uv run python -m unittest discover -s tests -v

      - name: Check the public surface
        run: uv run skillref check-public-surface .

  validate:
    name: validate
    if: always()
    needs:
      - checks
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every mandatory check
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: test "$CHECKS_RESULT" = "success"
