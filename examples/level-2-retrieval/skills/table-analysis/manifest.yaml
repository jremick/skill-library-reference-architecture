$schema: urn:skillref:schema:skill-manifest:0.1
schemaVersion: "0.1"
id: table-analysis
version: 1.0.0
name: Table analysis
description: Analyze supplied tables with explicit units, reproducible calculations, and conditional chart guidance.
license: Apache-2.0
domains:
  - data-analysis
triggers:
  include:
    - Analyze, compare, calculate, or chart values from a supplied table.
  exclude:
    - Do not use for prose-only documents without a tabular question.
risk:
  level: low
  sideEffects: false
  rationale: Reads supplied data and produces derived analysis without mutation.
permissions:
  capabilities:
    - content:read
    - table:analyze
  resourceScopes:
    - task:provided-content
resources:
  entrypoint: SKILL.md
  items:
    - path: references/chart-guidance.md
      role: reference
      mediaType: text/markdown
      loadWhen: Load only after activation when the user explicitly requests a chart.
      maxBytes: 4096
      digest:
        algorithm: sha256
        value: 7e1d4b3f8cc4be00b136c7ac1033228ed859dbf022e354d8c8089ee53db3c455
conflicts:
  hard: []
  supersedes: []
  companions: []
evaluation:
  suiteRefs:
    - evals/development/cases.json
    - evals/heldout/cases.json
compatibility:
  spec: agent-skills
  runtimes:
    - portable-core
  notes: Inspection alone does not satisfy the chart-resource load condition.
provenance:
  source: synthetic:table-analysis
  maintainers:
    - reference-architecture-maintainers
